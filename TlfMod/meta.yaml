# =========================================================================
# Tonberry Liberation Front — Penumbra mod manifest
# Frost UI–compatible meta.yaml schema (see Sevii77/frost_ui for the source
# format). This file defines the COLOR / CHROME / SHAPE options the user
# tweaks in Penumbra. Custom widgets (KH HP ring, Onion Knight job gauge,
# Limit Break, Player Cast Bar, Tonberry mascot perch) live in the Dalamud
# plugin half — see HANDOFF.md for that.
# =========================================================================

name: Tonberry Liberation Front
description: |
  [md]![Banner](banner.png)

  ## The Onion Knight UI. Grumpy. Heraldic. Operational.

  A Frost-UI–flavored theme + custom HUD plugin. Replaces the FFXIV chrome
  with vellum-on-indigo windows, swaps the player HP/MP for a Kingdom
  Hearts BBS-style ring + portrait that reacts to your vitals, and pins
  a Tonberry mascot to the corner so you remember whose chronicle this is.
version: 0.1.0
author: LastOnionKnight
website: https://example.invalid/tlf
tags:
  - Ui
  - Tlf

dependencies:
  # The custom KH-style player frame + job gauge + limit + cast bar +
  # mascot perch ship as a Dalamud plugin. The plugin half is OPTIONAL —
  # this mod renders fine without it; you just get color + chrome and
  # the vanilla parameter widget.
  - TonberryLiberationFront.Plugin (optional)

# ── Options exposed in the Penumbra options pane ─────────────────────────
options:

  - Generic: 0

  - Accent Preset:
      description: |
        [md]Five locked city-state palettes. Pick the heraldry of your
        Grand Company — the entire UI re-tints to match.
      default: Onion Ember
      options:
        - Onion Ember:
            description: "[md]Heralds of the Bastion · the default."
        - Limsa Azure:
            description: "[md]Maelstrom · Admiral Bloefhiswyn."
        - Ul'dah Gold:
            description: "[md]Immortal Flames · Flame General."
        - Gridania Leaf:
            description: "[md]Order of the Twin Adder."
        - Ishgard Frost:
            description: "[md]House Fortemps · Dragoon steel."

  - Foreground Color:
      description: Text + icon foreground; light by default for the dark theme.
      default: [0.95, 0.95, 0.96]
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Background Color:
      description: Window backdrop (alpha controls the frost blur fall-off).
      default: [0.078, 0.086, 0.110, 0.90]
      min: [0.0, 0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0, 1.0]

  - Secondary Color:
      description: Buttons / inputs / chrome accents.
      default: [0.227, 0.243, 0.282]
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Outline Color:
      description: Window outline. 178/178/178 by default per the original spec.
      default: [0.698, 0.698, 0.698, 1.0]
      min: [0.0, 0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0, 1.0]

  - Window Style:
      description: The shape and border position of every window chrome.
      default: Rounded Top Border
      options:
        - Rounded Top Border: { description: "[md]![](window/rounded_top.png)" }
        - Rounded Full Border: { description: "[md]![](window/rounded_full.png)" }
        - Rounded Edge Border: { description: "[md]![](window/rounded_edge.png)" }
        - Square Top Border: { description: "[md]![](window/square_top.png)" }
        - Square Full Border: { description: "[md]![](window/square_full.png)" }
        - Sharp: { description: "[md]![](window/sharp.png)" }

  - Shape Style:
      description: The shape of buttons and inputs.
      default: Rounded
      options:
        - Rounded: { description: "[md]6px corners." }
        - Square: { description: "[md]0px corners." }

  - Gauge:
      description: HP / MP / job gauge corner profile.
      default: Rounded
      options:
        - Rounded: { description: "[md]6px corners on standard bars." }
        - Square: { description: "[md]0px corners — heraldic mode." }

  - Combat: 0

  - Party List Background Color:
      description: Backdrop alpha of the party list panel. 0 = transparent.
      default: [0.0, 0.0, 0.0, 0.0]
      min: [0.0, 0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0, 1.0]

  - Castbar Color:
      description: Cast bar fill (target + party member casts).
      default: [1.0, 1.0, 1.0]
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Castbar Interruptable Color:
      description: Cast bar fill while interruptable.
      default: [0.9, 0.2, 0.1]
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Limit Break Charging Color:
      description: Limit Break bar — partial fill (charging segment).
      default: [0.749, 0.875, 1.0]
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Limit Break Full Color:
      description: Limit Break bar — completed segment (player can fire LB).
      default: [0.839, 0.482, 0.235]   # Onion Ember
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Proc Color:
      description: Action button proc dot color.
      default: [1.0, 0.678, 0.220]
      min: [0.0, 0.0, 0.0]
      max: [1.0, 1.0, 1.0]

  - Tlf Custom: 0

  - Tonberry Mascot Perch:
      description: |
        [md]Show the Tonberry mascot in the corner near the player frame.
        Reacts to your HP — vibes when full, hearts during casts, stabs
        when under 30%.
      default: Enabled
      options:
        - Enabled: { description: "" }
        - Disabled: { description: "" }

  - Player HP Style:
      description: |
        [md]How the player's HP renders. The KH ring is the canonical TLF
        visual; the bar style is the Frost-UI-faithful fallback for
        players who want a smaller footprint.
      default: KH Ring
      options:
        - KH Ring:
            description: "[md]Kingdom Hearts BBS-style 280° arc with center portrait orb."
        - Frost Bars:
            description: "[md]Two stacked horizontal bars · classic Frost UI."

  - Party Style:
      description: |
        [md]Party member rendering. KH adds the signature curl ornament
        on the HP bar tail.
      default: KH Curl
      options:
        - KH Curl:
            description: "[md]With the KH BBS curl loop ornament on each HP bar."
        - Classic:
            description: "[md]Plain horizontal bars."

# ── Presets — quick switches between named looks ─────────────────────────
presets:

  - TLF · Default:
      Accent Preset: Onion Ember

  - TLF · Maelstrom:
      Accent Preset: Limsa Azure
      Background Color: [0.078, 0.094, 0.149, 0.92]

  - TLF · Sultan's Gold:
      Accent Preset: Ul'dah Gold
      Background Color: [0.149, 0.118, 0.078, 0.92]

  - TLF · Twin Adder:
      Accent Preset: Gridania Leaf
      Background Color: [0.071, 0.118, 0.094, 0.92]

  - TLF · Ishgardian Steel:
      Accent Preset: Ishgard Frost
      Background Color: [0.094, 0.118, 0.149, 0.95]
      Window Style: Square Full Border
      Shape Style: Square

# ── Color slot map (reference for the .tex remap pipeline) ───────────────
# Each numeric slot is a CharaMakeType in-game palette index that the
# Penumbra remapper will substitute. Same scheme Frost UI uses.
colors:
  1: Foreground Color
  2: [Foreground Color, [0.0, 0.0, 0.0], [0.167, 0.167, 0.167]]
  3: [Foreground Color, [0.0, 0.0, 0.0], [0.333, 0.333, 0.333]]
  4: [Foreground Color, [0.0, 0.0, 0.0], [0.5, 0.5, 0.5]]
  7: [0.0, 0.0, 0.0]
  8: Foreground Color
  32: Accent  # see HANDOFF.md §3 — accent slot maps to current preset
  50: Foreground Color
  64: Foreground Color
  65: [0.0, 0.0, 0.0]

# ── ImGui style — used by the Dalamud plugin half via DalamudStyleConfig ─
# (Identical key names to Frost UI's; ported into ImGui's StyleVar table
#  by the Una.Drawing layer in the plugin.)
style:
  variables:
    WindowPadding:        [10.0, 10.0]
    FramePadding:         [8.0, 2.0]
    CellPadding:          [4.0, 4.0]
    ItemSpacing:          [4.0, 4.0]
    ItemInnerSpacing:     [4.0, 4.0]
    IndentSpacing:        20.0
    ScrollbarSize:        10.0
    GrabMinSize:          16.0
    WindowBorderSize:     2.0
    ChildBorderSize:      1.0
    PopupBorderSize:      1.0
    FrameBorderSize:      1.0
    TabBorderSize:        1.0
    WindowRounding:
      Window Style:
        Rounded Top Border:   10.0
        Rounded Full Border:  10.0
        Rounded Edge Border:  10.0
        Square Top Border:     0.0
        Square Full Border:    0.0
        Sharp:                 0.0
    FrameRounding:
      Shape Style:
        Rounded: 6.0
        Square:  0.0
    ScrollbarRounding:
      Shape Style:
        Rounded: 6.0
        Square:  0.0

  colors:
    Text:                Foreground Color
    WindowBg:            Background Color
    ChildBg:             [0.0, 0.0, 0.0, 0.0]
    PopupBg:             Secondary Color
    Border:              Outline Color
    BorderShadow:        [0.0, 0.0, 0.0, 0.0]
    FrameBg:             Secondary Color
    TitleBg:             Background Color
    TitleBgActive:       Background Color
    Button:              Secondary Color
    ButtonHovered:       [Secondary Color, [1.1, 1.1, 1.1, 1.0]]
    ButtonActive:        [Secondary Color, [1.15, 1.15, 1.15, 1.0]]
    CheckMark:           Accent
    SliderGrab:          Accent
    Header:              Secondary Color
    Separator:           Outline Color
    Tab:                 Secondary Color
    TabHovered:          Accent
    TabActive:           Accent
    PlotLines:           Accent
    NavHighlight:        Accent
    TextSelectedBg:      Accent
    DragDropTarget:      Accent
